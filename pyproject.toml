[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "integritywatch"
dynamic = ["version"]
description = "A small file integrity monitor that detects unauthorized changes to files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KUYA PITER" }]
keywords = ["security", "file-integrity", "fim", "monitoring", "sha256"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Environment :: Console",
]

[project.scripts]
integritywatch = "integritywatch.cli:main"

[tool.setuptools]
packages = ["integritywatch"]

[tool.setuptools.dynamic]
version = { attr = "integritywatch.__version__" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.coverage.run]
source = ["integritywatch"]
branch = true

[tool.coverage.report]
show_missing = true
